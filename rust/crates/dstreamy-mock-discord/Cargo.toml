[package]
name = "dstreamy-mock-discord"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
davey = "0.1.5"
flate2 = "1"
futures-util = "0.3"
openmls = "0.8"
openmls_basic_credential = "0.5"
openmls_rust_crypto = "0.5"
rand = "0.9"
serde_json = "1"
thiserror = "2"
tls_codec = "0.4"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
webrtc = "0.14"

[dev-dependencies]
discord-stream-rs = { path = "../../vendor/discord-stream-rs" }
dstreamy-discord = { path = "../dstreamy-discord" }
dstreamy-media = { path = "../dstreamy-media" }
secrecy = "0.10"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true

[[bin]]
name = "mock-discord"
path = "src/launcher.rs"
