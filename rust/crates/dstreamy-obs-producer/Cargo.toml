[package]
name = "dstreamy-obs-producer"
description = "The OBS plugin's libobs-free half: the packet ring, the producer connection and the control logic for `dstreamy serve`"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dstreamy-obs-packet = { path = "../dstreamy-obs-packet" }
serde.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

# dstreamy-ipc has no Windows transport yet; there the plugin builds without the connection.
[target.'cfg(unix)'.dependencies]
dstreamy-ipc = { path = "../dstreamy-ipc" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
dstreamy-core = { path = "../dstreamy-core" }
dstreamy-mock-discord = { path = "../dstreamy-mock-discord" }
dstreamy-test-producer = { path = "../dstreamy-test-producer" }
libc = "0.2"
tempfile.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
