[package]
name = "dstreamy-media"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
dstreamy-core = { path = "../dstreamy-core" }
openh264 = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
tracing = "0.1"
unsafe-libopus = "0.2"

[dev-dependencies]
proptest = "1"
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
