[package]
name = "dstreamy-media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
dstreamy-core = { path = "../dstreamy-core" }
openh264 = { version = "0.9", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
tracing = "0.1"
unsafe-libopus = "0.2"

[features]
# Source-built OpenH264 for the test pattern; release builds leave it out (ADR 0010).
openh264 = ["dep:openh264"]

[dev-dependencies]
dstreamy-media = { path = ".", features = ["openh264"] }
openh264 = "0.9"
proptest = "1"
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
