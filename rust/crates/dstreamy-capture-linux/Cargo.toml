[package]
name = "dstreamy-capture-linux"
version.workspace = true
edition.workspace = true
publish.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
async-trait = "0.1"
dstreamy-media = { path = "../dstreamy-media" }
glib = { version = "0.22", features = ["v2_74"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
tokio = { version = "1", features = ["sync", "rt"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
openh264 = "0.9"
tokio = { version = "1", features = ["sync", "rt", "macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
