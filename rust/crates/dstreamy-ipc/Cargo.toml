[package]
name = "dstreamy-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["net"] }
tokio-util = { version = "0.7", features = ["codec"] }

[features]
test-support = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["net", "sync", "time"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
dstreamy-ipc = { path = ".", features = ["test-support"] }
futures-util = { version = "0.3", features = ["sink"] }
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
