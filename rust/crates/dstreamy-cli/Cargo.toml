[package]
name = "dstreamy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
dstreamy-core = { path = "../dstreamy-core" }
dstreamy-discord = { path = "../dstreamy-discord" }
dstreamy-ipc = { path = "../dstreamy-ipc" }
dstreamy-media = { path = "../dstreamy-media" }
qrcode = { version = "0.14", default-features = false }
ratatui = "0.30"
rpassword = "7"
secrecy = "0.10"
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
getrandom = { version = "0.3", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
url = "2"
webrtc = "0.14"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false, optional = true }
dstreamy-capture-macos = { path = "../dstreamy-capture-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", optional = true }
gtk = { version = "0.18", optional = true }
async-trait = "0.1"
dstreamy-capture-linux = { path = "../dstreamy-capture-linux" }

[dev-dependencies]
assert_cmd = "2"
dstreamy-cli = { path = ".", features = ["test-hooks"] }
dstreamy-mock-discord = { path = "../dstreamy-mock-discord" }
dstreamy-test-producer = { path = "../dstreamy-test-producer" }
insta = "1"
openh264 = "0.9"
serde_json = "1"
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[features]
# Pulls in a system webview (WebKitGTK on Linux), so default builds leave it out.
browser-login = ["dep:tao", "dep:wry", "dep:muda", "dep:webkit2gtk", "dep:gtk", "dep:getrandom"]
test-hooks = ["dstreamy-discord/test-rtp-start"]

[lints]
workspace = true

[lib]
name = "dstreamy_cli"
path = "src/lib.rs"

[[bin]]
name = "dstreamy"
path = "src/main.rs"
