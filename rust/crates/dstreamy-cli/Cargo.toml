[package]
name = "dstreamy-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
dstreamy-core = { path = "../dstreamy-core" }
dstreamy-discord = { path = "../dstreamy-discord" }
dstreamy-ipc = { path = "../dstreamy-ipc" }
dstreamy-media = { path = "../dstreamy-media" }
ratatui = "0.30"
rpassword = "7"
secrecy = "0.10"
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
url = "2"
webrtc = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
dstreamy-capture-macos = { path = "../dstreamy-capture-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
async-trait = "0.1"
dstreamy-capture-linux = { path = "../dstreamy-capture-linux" }

[dev-dependencies]
assert_cmd = "2"
dstreamy-cli = { path = ".", features = ["test-hooks"] }
dstreamy-mock-discord = { path = "../dstreamy-mock-discord" }
insta = "1"
serde_json = "1"
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[features]
test-hooks = []

[lints]
workspace = true

[lib]
name = "dstreamy_cli"
path = "src/lib.rs"

[[bin]]
name = "dstreamy"
path = "src/main.rs"
