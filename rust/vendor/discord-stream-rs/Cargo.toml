[package]
name = "discord-stream-rs"
version = "0.1.3+dstreamy"
edition = "2024"
authors = ["Tky567", "lkshrk"]
description = "D-Streamy's fork of discord-stream-rs 0.1.3 (Tky567/stream-discord-rs); see VENDOR.md for the local changes"
license = "MIT"
repository = "https://github.com/lkshrk/d-streamy"
publish = false
exclude = [
    "target/",
    ".git/",
    ".gitignore",
    ".vscode/",
    "Cargo.lock",
]

[features]
default = []
# Test builds only (`dstreamy-cli/test-hooks`): RTP timestamps start at 0, so a receiver reads pts from them.
test-rtp-start = []
# Test builds only: lets VOICE_SERVER_UPDATE name a `ws://` endpoint, for the mock server.
test-hooks = []

[dependencies]
# DAVE / E2EE
davey = "0.1.3"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
futures-util = "0.3"

# WebRTC (ICE + DTLS-SRTP + RTP)
webrtc = "=0.14.0"
bytes = "1"
async-trait = "0.1"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Errors
thiserror = "2"

[dev-dependencies]
discord-stream-rs = { path = ".", features = ["test-hooks"] }
dstreamy-mock-discord = { path = "../../crates/dstreamy-mock-discord" }
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = "0.3"
