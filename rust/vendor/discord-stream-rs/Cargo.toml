[package]
name = "discord-stream-rs"
version = "0.1.3"
edition = "2024"
authors = ["Tky567"]
description = "Discord voice/video streaming library for selfbots, ported from @dank074/discord-video-stream"
license = "MIT"
repository = "https://github.com/Tky567/stream-discord-rs"
documentation = "https://docs.rs/discord-stream-rs"
homepage = "https://github.com/Tky567/stream-discord-rs"
exclude = [
    "target/",
    ".git/",
    ".gitignore",
    ".vscode/",
    "Cargo.lock",
]

[features]
default = []
media = ["dep:ffmpeg-next"]

[dependencies]
# DAVE / E2EE
davey = "0.1.3"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
futures-util = "0.3"

# WebRTC (ICE + DTLS-SRTP + RTP)
webrtc = "0.14"
bytes = "1"
async-trait = "0.1"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Errors
thiserror = "2"

# FFmpeg bindings (media demux/decode/encode pipeline)
ffmpeg-next = { version = "7", features = ["codec", "format", "filter", "software-resampling", "software-scaling"], optional = true }

[dev-dependencies]
dstreamy-mock-discord = { path = "../../crates/dstreamy-mock-discord" }
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = "0.3"
