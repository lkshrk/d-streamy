[workspace]
resolver = "3"
members = ["crates/*", "vendor/discord-stream-rs"]
exclude = ["vendor/webrtc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[patch.crates-io]
webrtc = { path = "vendor/webrtc" }
