name: CI

on:
  push:
    branches: [main, rust-rewrite]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Select latest Xcode 16 (needs SDK >= 15.2 for SCContentFilter.includedWindows)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install daemon dependencies
        run: bun install

      - name: Daemon tests (Bun)
        run: bun test

      - name: Type-check daemon
        run: bunx tsc --noEmit

      - name: Build & test (Swift)
        run: swift test
