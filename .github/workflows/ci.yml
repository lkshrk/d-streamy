name: CI

on:
  push:
    branches: [main, rust-rewrite]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Line tables keep file:line in backtraces at a fraction of full debuginfo's size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          swift --version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install daemon dependencies
        run: bun install

      - name: Daemon tests (Bun)
        run: bun test

      - name: Type-check daemon
        run: bunx tsc --noEmit

      - name: Install toolchain from rust-toolchain.toml
        working-directory: rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: xcode-27.1

      - name: Build dstreamy and the mock Discord server
        working-directory: rust
        run: cargo build --locked -p dstreamy-cli -p dstreamy-mock-discord

      - name: Build & test (Swift)
        env:
          DSTREAMY_INTEGRATION: "1"
        run: swift test
