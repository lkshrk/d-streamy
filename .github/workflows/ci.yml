name: CI

on:
  push:
    branches: [main, rust-rewrite]
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Line tables keep file:line in backtraces at a fraction of full debuginfo's size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Preserve CI evidence for every direct-to-main commit by never cancelling main runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          swift --version

      - name: Install toolchain from rust-toolchain.toml
        working-directory: rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: xcode-27.1

      - name: Build dstreamy and the mock Discord server
        working-directory: rust
        run: cargo build --locked -p dstreamy-cli --features test-hooks -p dstreamy-mock-discord

      - name: Build & test (Swift)
        env:
          DSTREAMY_INTEGRATION: "1"
        run: swift test
