name: OBS

on:
  push:
    branches: [rust-rewrite, "ci/obs-**"]
    paths:
      - "obs/**"
      - "rust/crates/dstreamy-test-producer/**"
      - "rust/Cargo.lock"
      - ".github/workflows/obs-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obs-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OBS_TAG: "32.2.2"
  OBS_COMMIT: ba2f32bdf791005443988a4955e963663e16b1ed
  OBS_BUILD_REV: "1"

jobs:
  obs-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set paths
        run: |
          {
            echo "OBS_PREFIX=$RUNNER_TEMP/obs-prefix"
            echo "OBS_LOGS=$RUNNER_TEMP/obs-logs"
            echo "OBS_TRACES=$RUNNER_TEMP/traces"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/obs-logs"

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl jq \
            libglib2.0-dev extra-cmake-modules libcurl4-openssl-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libjansson-dev libx11-xcb-dev libgles2-mesa-dev \
            libwayland-dev libpipewire-0.3-dev libpulse-dev libx264-dev libmbedtls-dev libgl1-mesa-dev \
            uthash-dev libsimde-dev libx11-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinerama0-dev \
            libxcb-composite0-dev libxinerama-dev libxcb1-dev libxcb-xfixes0-dev libxss-dev libglvnd-dev \
            libxkbcommon-dev libxcomposite-dev libxdamage-dev libasound2-dev libfontconfig-dev \
            libfreetype6-dev libspeexdsp-dev libudev-dev libv4l-dev libva-dev libpci-dev libdrm-dev \
            nlohmann-json3-dev libwebsocketpp-dev libasio-dev libqrcodegencpp-dev \
            qt6-base-dev libqt6svg6-dev qt6-base-private-dev \
            xvfb xauth libegl-mesa0 libgl1-mesa-dri mesa-utils

      - name: Restore OBS build
        id: obs-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/obs-prefix
          key: obs-${{ env.OBS_TAG }}-ubuntu-24.04-r${{ env.OBS_BUILD_REV }}

      - name: Build OBS ${{ env.OBS_TAG }} with the frontend and obs-websocket
        if: steps.obs-cache.outputs.cache-hit != 'true'
        run: |
          start=$(date +%s)
          git clone --depth 1 --branch "$OBS_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/obsproject/obs-studio.git "$RUNNER_TEMP/obs-src"
          cd "$RUNNER_TEMP/obs-src"
          test "$(git rev-parse HEAD)" = "$OBS_COMMIT"
          cmake --preset ubuntu \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$OBS_PREFIX" \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
            -DENABLE_BROWSER=OFF -DENABLE_SCRIPTING=OFF -DENABLE_VLC=OFF \
            -DENABLE_NVENC=OFF -DENABLE_QSV11=OFF -DENABLE_NEW_MPEGTS_OUTPUT=OFF \
            -DENABLE_WEBRTC=OFF -DENABLE_AJA=OFF
          cmake --build build_ubuntu --parallel
          cmake --install build_ubuntu
          echo "OBS build took $(( $(date +%s) - start )) s" | tee "$OBS_PREFIX/build-time.txt"

      - name: Save OBS build
        if: steps.obs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/obs-prefix
          key: obs-${{ env.OBS_TAG }}-ubuntu-24.04-r${{ env.OBS_BUILD_REV }}

      - name: Check the OBS install
        run: |
          cat "$OBS_PREFIX/build-time.txt" || true
          libdir=$(dirname "$(find "$OBS_PREFIX" -name 'libobs.so.*' | head -n 1)")
          echo "LD_LIBRARY_PATH=$libdir" >> "$GITHUB_ENV"
          for m in obs-x264 obs-ffmpeg obs-outputs image-source obs-websocket frontend-tools; do
            test -f "$libdir/obs-plugins/$m.so" || { echo "missing module $m"; exit 1; }
          done
          test -x "$OBS_PREFIX/bin/obs"

      - name: Install Rust toolchain from rust-toolchain.toml
        working-directory: rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: obs-linux

      - name: Build the trace checker
        working-directory: rust
        run: |
          cargo build --release --locked -p dstreamy-test-producer --bin obs-trace-check
          echo "TRACE_CHECK=$PWD/target/release/obs-trace-check" >> "$GITHUB_ENV"

      - name: Configure, build and test obs/
        working-directory: obs
        run: |
          cmake --preset ubuntu-ci-x86_64 -DCMAKE_PREFIX_PATH="$OBS_PREFIX"
          cmake --build --preset ubuntu-ci-x86_64
          xvfb-run -a -s "-screen 0 1280x720x24" ctest --preset ubuntu-ci-x86_64
          echo "HARNESS=$PWD/build_x86_64/harness/obs-harness" >> "$GITHUB_ENV"

      - name: Harness 5 s trace with A/V marker check
        run: |
          set -o pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1280x720x24" "$HARNESS" --seconds 5 \
            --trace-dir "$RUNNER_TEMP/trace-5s" --profile main --bf 0 --keyint-sec 2 \
            | tee "$OBS_LOGS/harness-5s.log"
          "$TRACE_CHECK" "$RUNNER_TEMP/trace-5s" --fps 30 --seconds 5 | tee "$OBS_LOGS/trace-check-5s.log"

      - name: Record traces
        working-directory: ${{ runner.temp }}
        run: |
          set -o pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1280x720x24" \
            bash "$GITHUB_WORKSPACE/obs/tests/record-traces.sh" "$HARNESS" "$TRACE_CHECK" traces \
            | tee "$OBS_LOGS/record-traces.log"

      - name: Check recorded traces against the specs
        working-directory: rust
        run: |
          rm -rf ../obs/tests/traces
          cp -R "$OBS_TRACES" ../obs/tests/traces
          cargo test --release --locked -p dstreamy-media --test obs_traces

      - name: Frontend with obs-websocket
        run: |
          set -o pipefail
          export XDG_CONFIG_HOME="$RUNNER_TEMP/obs-config" LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1920x1080x24" bash obs/tests/frontend/frontend-smoke.sh \
            "$XDG_CONFIG_HOME/obs-studio" "$OBS_LOGS/frontend-stdout.log" "$OBS_PREFIX/bin/obs" \
            | tee "$OBS_LOGS/frontend.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: obs-traces-linux
          path: ${{ runner.temp }}/traces
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: obs-logs-linux
          path: |
            ${{ runner.temp }}/obs-logs
            ${{ runner.temp }}/trace-5s
            obs/build_x86_64/Testing/Temporary
