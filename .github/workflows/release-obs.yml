name: Release (OBS plugin)

on:
  push:
    tags: ["obs-v*"]
  # Rehearsals upload artifacts and may notarize, but only exact obs-v tags can publish a release.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (the run must be on tag obs-v<obs/buildspec.json version>)
        type: boolean
        default: false

concurrency:
  group: release-obs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  OBS_TAG: "32.2.2"
  OBS_COMMIT: ba2f32bdf791005443988a4955e963663e16b1ed
  OBS_BUILD_REV: "1"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Resolve the version and whether this run publishes
        id: check
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          version=$(jq -r .version obs/buildspec.json)
          test "$(jq -r '.dependencies["obs-studio"].version' obs/buildspec.json)" = "$OBS_TAG"
          publish=false
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$INPUT_PUBLISH" = true ]; then
            publish=true
            if [ "$REF_TYPE" != tag ] || [ "$TAG" != "obs-v$version" ]; then
              echo "::error::Publishing needs the run to be on tag obs-v$version (obs/buildspec.json); this is $REF_TYPE $TAG"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "obs-dstreamy $version, publish: $publish" >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      APT_CACHE: apt-obs-linux-ubuntu-24.04
      PACKAGE: obs-dstreamy-${{ needs.version.outputs.version }}-linux-x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set paths
        run: echo "OBS_PREFIX=$RUNNER_TEMP/obs-prefix" >> "$GITHUB_ENV"
      - name: Restore apt archives
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/apt-archives
          key: ${{ env.APT_CACHE }}-${{ github.run_id }}
          restore-keys: ${{ env.APT_CACHE }}-
      - name: Install system dependencies
        timeout-minutes: 30
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" \
            build-essential cmake ninja-build pkg-config git curl jq libglib2.0-dev \
            extra-cmake-modules libcurl4-openssl-dev libavcodec-dev libavdevice-dev libavfilter-dev \
            libavformat-dev libavutil-dev libswresample-dev libswscale-dev libjansson-dev \
            libx11-xcb-dev libgles2-mesa-dev libwayland-dev libpipewire-0.3-dev libpulse-dev \
            libx264-dev libmbedtls-dev libgl1-mesa-dev uthash-dev libsimde-dev libx11-dev \
            libxcb-randr0-dev libxcb-shm0-dev libxcb-xinerama0-dev libxcb-composite0-dev \
            libxinerama-dev libxcb1-dev libxcb-xfixes0-dev libxss-dev libglvnd-dev libxkbcommon-dev \
            libxcomposite-dev libxdamage-dev libasound2-dev libfontconfig-dev libfreetype6-dev \
            libspeexdsp-dev libudev-dev libv4l-dev libva-dev libpci-dev libdrm-dev \
            nlohmann-json3-dev libwebsocketpp-dev libasio-dev libqrcodegencpp-dev qt6-base-dev \
            libqt6svg6-dev qt6-base-private-dev \
            libclang-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Restore OBS build
        id: obs
        uses: ./.github/actions/obs-prefix-fetch
        with:
          key: obs-${{ env.OBS_TAG }}-ubuntu-24.04-r${{ env.OBS_BUILD_REV }}
          path: ${{ runner.temp }}/obs-prefix
      - name: Build OBS ${{ env.OBS_TAG }} with the frontend and obs-websocket
        if: steps.obs.outputs.hit != 'true'
        run: bash .github/scripts/obs-linux-build.sh
      - name: Check the OBS install
        run: bash .github/scripts/obs-linux-check-install.sh
      - name: Install Rust toolchain from rust-toolchain.toml
        working-directory: rust
        run: rustup toolchain install
      - name: Configure, build and stage obs/
        working-directory: obs
        run: |
          set -euo pipefail
          cmake --preset ubuntu-x86_64 -DCMAKE_PREFIX_PATH="$OBS_PREFIX"
          cmake --build --preset ubuntu-x86_64
          cmake --install build_x86_64 --prefix "$RUNNER_TEMP/stage"
          find "$RUNNER_TEMP/stage" -print
          plugins="$RUNNER_TEMP/stage/lib/x86_64-linux-gnu/obs-plugins"
          test -f "$plugins/obs-dstreamy.so"
          test -f "$plugins/dstreamy-ui/obs-dstreamy-ui.so"
          grep -q "Tabler Icons" "$plugins/dstreamy-ui/THIRD_PARTY_NOTICES.txt"
          python3 "$GITHUB_WORKSPACE/scripts/third-party-notices.py" \
            --manifest "$GITHUB_WORKSPACE/rust/crates/dstreamy-obs/Cargo.toml" --package dstreamy-obs \
            --target x86_64-unknown-linux-gnu \
            --append "$plugins/dstreamy-ui/THIRD_PARTY_NOTICES.txt" \
            --output "$plugins/dstreamy-ui/THIRD_PARTY_NOTICES.txt"
          if find "$plugins" -maxdepth 1 -name '*.so' ! -name obs-dstreamy.so | grep .; then
            echo "libobs would try these as modules: only obs-dstreamy.so may sit in the module folder"
            exit 1
          fi
          cmake -DTEST_HOOKS=OFF -DLIBRARY="$plugins/obs-dstreamy.so" -P cmake/common/check_test_hooks.cmake
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp LICENSE "$RUNNER_TEMP/stage/"
          # The tree unpacks over /usr or ~/.local; sorted names and a fixed mtime make it reproducible.
          tar --format=gnu --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP/stage" -cf - . | gzip -n -9 > "dist/$PACKAGE.tar.gz"
          (cd dist && sha256sum "$PACKAGE.tar.gz" > "$PACKAGE.tar.gz.sha256" && cat "$PACKAGE.tar.gz.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE }}
          path: dist/${{ env.PACKAGE }}.tar.gz*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      PACKAGE: obs-dstreamy-${{ needs.version.outputs.version }}-macos-universal
      MACOS_SIGNING: ${{ secrets.SIGNING_IDENTITY != '' && secrets.DEVELOPER_ID_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Publishing needs the macOS signing secrets
        if: needs.version.outputs.publish == 'true' && env.MACOS_SIGNING != 'true'
        run: |
          echo "::error::SIGNING_IDENTITY and DEVELOPER_ID_CERT_P12 are not set; a published plugin must be signed"
          exit 1
      - name: Install Rust toolchain from rust-toolchain.toml
        working-directory: rust
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Configure and build obs/ (universal)
        working-directory: obs
        run: |
          set -o pipefail
          cmake --preset macos
          cmake --build --preset macos -- -quiet 2>&1 | xcbeautify --quiet --renderer github-actions
      - name: Check the plugin bundle
        working-directory: obs/build_macos/rundir/obs-dstreamy.plugin/Contents
        run: |
          set -euo pipefail
          test "$(lipo -archs MacOS/obs-dstreamy)" = "x86_64 arm64"
          test "$(lipo -archs MacOS/obs-dstreamy-ui.dylib)" = "x86_64 arm64"
          test -f Info.plist
          cp "$GITHUB_WORKSPACE/LICENSE" Resources/LICENSE
          grep -q "Tabler Icons" Resources/THIRD_PARTY_NOTICES.txt
          python3 "$GITHUB_WORKSPACE/scripts/third-party-notices.py" \
            --manifest "$GITHUB_WORKSPACE/rust/crates/dstreamy-obs/Cargo.toml" --package dstreamy-obs \
            --target aarch64-apple-darwin --target x86_64-apple-darwin \
            --append "Resources/THIRD_PARTY_NOTICES.txt" --output Resources/THIRD_PARTY_NOTICES.txt
          cmake -DTEST_HOOKS=OFF -DLIBRARY=MacOS/obs-dstreamy -P "$GITHUB_WORKSPACE/obs/cmake/common/check_test_hooks.cmake"
      - name: Import the Developer ID certificate
        if: env.MACOS_SIGNING == 'true'
        uses: ./.github/actions/macos-signing-keychain
        with:
          cert-p12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          cert-password: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
      - name: Sign the plugin (Developer ID, hardened runtime)
        if: env.MACOS_SIGNING == 'true'
        working-directory: obs/build_macos/rundir
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # Nested code first, then the bundle, so the bundle seal covers the signed dylib.
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" \
            obs-dstreamy.plugin/Contents/MacOS/obs-dstreamy-ui.dylib
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" obs-dstreamy.plugin
          codesign --verify --strict --deep --verbose=2 obs-dstreamy.plugin
          ditto -c -k --keepParent obs-dstreamy.plugin "$RUNNER_TEMP/obs-dstreamy-notarize.zip"
      - name: Notarize the plugin
        if: env.MACOS_SIGNING == 'true'
        uses: ./.github/actions/macos-notarize
        with:
          path: ${{ runner.temp }}/obs-dstreamy-notarize.zip
          key-p8: ${{ secrets.NOTARY_KEY_P8 }}
          key-id: ${{ secrets.NOTARY_KEY_ID }}
          issuer-id: ${{ secrets.NOTARY_ISSUER_ID }}
      - name: Staple the plugin
        if: env.MACOS_SIGNING == 'true'
        working-directory: obs/build_macos/rundir
        run: xcrun stapler staple obs-dstreamy.plugin
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd obs/build_macos/rundir && ditto -c -k --keepParent --sequesterRsrc obs-dstreamy.plugin "$GITHUB_WORKSPACE/dist/$PACKAGE.zip")
          # The plugin goes into ~/Library/Application Support/obs-studio/plugins/.
          (cd dist && shasum -a 256 "$PACKAGE.zip" > "$PACKAGE.zip.sha256" && cat "$PACKAGE.zip.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE }}
          path: dist/${{ env.PACKAGE }}.zip*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE: obs-dstreamy-${{ needs.version.outputs.version }}-windows-x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain from rust-toolchain.toml
        working-directory: rust
        run: rustup toolchain install
      - name: Locate libclang for bindgen
        run: |
          $dll = Get-ChildItem "$env:ProgramFiles\LLVM\bin\libclang.dll" -ErrorAction Stop
          "LIBCLANG_PATH=$($dll.DirectoryName)" >> $env:GITHUB_ENV
      - name: Configure, build and stage obs/
        working-directory: obs
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --preset windows-x64
          cmake --build --preset windows-x64 -- /consoleLoggerParameters:Summary /noLogo /verbosity:minimal
          cmake --install build_x64 --config RelWithDebInfo --prefix "$env:RUNNER_TEMP\stage"
      - name: Check the staged layout
        shell: bash
        run: |
          set -euo pipefail
          stage="$(cygpath -u "$RUNNER_TEMP")/stage"
          find "$stage" -print
          bin="$stage/obs-dstreamy/bin/64bit"
          for f in obs-dstreamy.dll dstreamy-ui/obs-dstreamy-ui.dll dstreamy-ui/THIRD_PARTY_NOTICES.txt; do
            test -f "$bin/$f" || { echo "the install lacks obs-dstreamy/bin/64bit/$f"; exit 1; }
          done
          python3 "$GITHUB_WORKSPACE/scripts/third-party-notices.py" \
            --manifest "$GITHUB_WORKSPACE/rust/crates/dstreamy-obs/Cargo.toml" --package dstreamy-obs \
            --target x86_64-pc-windows-msvc \
            --append "$bin/dstreamy-ui/THIRD_PARTY_NOTICES.txt" \
            --output "$bin/dstreamy-ui/THIRD_PARTY_NOTICES.txt"
          if find "$bin" -maxdepth 1 -name '*.dll' ! -name obs-dstreamy.dll | grep .; then
            echo "libobs would try these as modules: only obs-dstreamy.dll may sit in the module folder"
            exit 1
          fi
          cmake -DTEST_HOOKS=OFF -DWINDOWS=ON "-DLIBRARY=$(cygpath -m "$bin/obs-dstreamy.dll")" \
            -P "$(cygpath -m "$GITHUB_WORKSPACE")/obs/cmake/common/check_test_hooks.cmake"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          stage="$(cygpath -u "$RUNNER_TEMP")/stage"
          mkdir -p dist
          cp LICENSE "$stage/obs-dstreamy/"
          # The obs-dstreamy folder goes into %ProgramData%\obs-studio\plugins\.
          (cd "$stage" && 7z a -tzip -mx=9 "$(cygpath -w "$GITHUB_WORKSPACE/dist/$PACKAGE.zip")" obs-dstreamy >/dev/null)
          (cd dist && sha256sum "$PACKAGE.zip" > "$PACKAGE.zip.sha256" && cat "$PACKAGE.zip.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE }}
          path: dist/${{ env.PACKAGE }}.zip*
          if-no-files-found: error

  rehearse:
    needs: [version, linux, macos, windows]
    if: needs.version.outputs.publish != 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: obs-dstreamy-*
          path: dist
          merge-multiple: true
      - name: Check the artifacts the release job would upload
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum -c -- *.sha256
          for package in "obs-dstreamy-$VERSION-linux-x86_64.tar.gz" "obs-dstreamy-$VERSION-macos-universal.zip" \
            "obs-dstreamy-$VERSION-windows-x64.zip"; do
            test -f "$package" || { echo "missing $package" >&2; exit 1; }
          done
          { echo "Rehearsal of obs-dstreamy $VERSION. No GitHub release or Homebrew update was published.";
            echo 'Workflow artifacts were uploaded; signing and notarization may contact Apple when configured.';
            echo; cat ./*.sha256; } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [version, linux, macos, windows]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: obs-dstreamy-*
          path: dist
          merge-multiple: true
      - name: Verify the checksums
        run: cd dist && sha256sum -c -- *.sha256
      - name: Create or update the GitHub release
        run: |
          set -euo pipefail
          cat dist/*.sha256 | tee -a "$GITHUB_STEP_SUMMARY"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag \
              --title "D-Streamy for OBS ${TAG#obs-v} (preview)" --generate-notes --prerelease --latest=false
          fi
          gh release upload "$TAG" dist/* --clobber
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
