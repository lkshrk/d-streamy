name: Rust CI

on:
  push:
    branches: [main, rust-rewrite]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Line tables keep file:line in backtraces at a fraction of full debuginfo's size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: rust-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust-macos:
    runs-on: xcode-27
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: xcode-27.1
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy with browser-login
        run: cargo clippy -p dstreamy-cli --features browser-login --all-targets --locked -- -D warnings
      - name: Browser login tests
        run: cargo test -p dstreamy-cli --features browser-login --locked --lib --test browser_login
      - name: Install cargo-nextest
        env:
          ARCHIVE: cargo-nextest-0.9.148-universal-apple-darwin.tar.gz
          SHA256: 6c23b7fb4ca82c571fc8dfedbab45bfa773d45918f933170c85d21cd7f4b852b
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/$ARCHIVE" | shasum -a 256 -c -
          echo "logical CPUs: $(getconf _NPROCESSORS_ONLN)"
          rm -f "${CARGO_HOME:-$HOME/.cargo}/bin/cargo-nextest"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/bin" cargo-nextest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/bin:$PATH" cargo nextest --version
      - name: Build mock-producer
        run: |
          cargo build --locked -p dstreamy-test-producer --bin mock-producer
          echo "DSTREAMY_MOCK_PRODUCER=$PWD/target/debug/mock-producer" >> "$GITHUB_ENV"
      - name: Tests except trace_replay
        run: >-
          cargo nextest run --workspace --locked --profile ci
          -E 'not binary_id(dstreamy-cli::trace_replay)'
        env:
          DSTREAMY_BIN: ${{ github.workspace }}/rust/target/debug/dstreamy
      - name: Trace replay tests
        run: cargo test --workspace --locked --test trace_replay
        env:
          DSTREAMY_TRACE_REPLAY_STRICT: "1"
          DSTREAMY_BIN: ${{ github.workspace }}/rust/target/debug/dstreamy
      - name: Doc tests
        run: cargo test --workspace --locked --doc
      - name: Cross-user IPC tests
        run: cargo test -p dstreamy-ipc --locked --test cross_user -- --ignored --skip nobody_helper
        timeout-minutes: 5
        env:
          DSTREAMY_CROSS_USER_TESTS: "1"

  rust-linux:
    name: rust-linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            nextest_sha256: 223ba936714cc861a9cdedad5a8eb664dfdd69d6fbdf6cea6aa8184f523290dc
          - os: ubuntu-24.04-arm
            arch: aarch64
            nextest_sha256: 81469eb963ef883fd590e60189e77d6aba3d91b418591d3391f50fe3e9480d2b
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    env:
      APT_CACHE: apt-rust-linux-${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Restore apt archives
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/apt-archives
          key: ${{ env.APT_CACHE }}-${{ github.run_id }}
          restore-keys: ${{ env.APT_CACHE }}-
      - name: Install system dependencies
        timeout-minutes: 30
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" \
            clang libclang-dev libpipewire-0.3-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - name: Save apt archives
        if: always()
        uses: ./.github/actions/apt-archives-save
        with:
          key-prefix: ${{ env.APT_CACHE }}
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install cargo-nextest
        env:
          ARCHIVE: cargo-nextest-0.9.148-${{ matrix.arch }}-unknown-linux-gnu.tar.gz
          SHA256: ${{ matrix.nextest_sha256 }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/$ARCHIVE" | shasum -a 256 -c -
          echo "logical CPUs: $(getconf _NPROCESSORS_ONLN)"
          rm -f "${CARGO_HOME:-$HOME/.cargo}/bin/cargo-nextest"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/bin" cargo-nextest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/bin:$PATH" cargo nextest --version
      - name: Build mock-producer
        run: |
          cargo build --locked -p dstreamy-test-producer --bin mock-producer
          echo "DSTREAMY_MOCK_PRODUCER=$PWD/target/debug/mock-producer" >> "$GITHUB_ENV"
      - name: Tests except trace_replay
        run: >-
          cargo nextest run --workspace --locked --profile ci
          -E 'not binary_id(dstreamy-cli::trace_replay)'
        env:
          DSTREAMY_BIN: ${{ github.workspace }}/rust/target/debug/dstreamy
      - name: Trace replay tests
        run: cargo test --workspace --locked --test trace_replay
        env:
          DSTREAMY_TRACE_REPLAY_STRICT: "1"
          DSTREAMY_BIN: ${{ github.workspace }}/rust/target/debug/dstreamy
      - name: Doc tests
        run: cargo test --workspace --locked --doc
      - name: Shipped crates never enable test-only features
        shell: bash
        run: |
          set -euo pipefail
          out=$(cargo tree --locked --target all -e features,normal -i dstreamy-ipc --workspace)
          if grep -F 'feature "test-support"' <<<"$out"; then
            echo "dstreamy-ipc test-support is enabled through a normal dependency" >&2
            exit 1
          fi
          out=$(cargo tree --locked --target all -e features,normal -i discord-stream-rs --workspace)
          if grep -E 'feature "(test-hooks|test-rtp-start)"' <<<"$out"; then
            echo "discord-stream-rs test-only features are enabled through a normal dependency" >&2
            exit 1
          fi
          out=$(cargo tree --locked --target all -e features,normal -i dstreamy-cli --workspace)
          if grep -E 'feature "(test-hooks|test-pattern)"' <<<"$out"; then
            echo "dstreamy-cli test-hooks or test-pattern is enabled through a normal dependency" >&2
            exit 1
          fi
          out=$(cargo tree --locked --target all -e features,normal -i dstreamy-discord --workspace)
          if grep -F 'feature "test-hooks"' <<<"$out"; then
            echo "dstreamy-discord test-hooks is enabled through a normal dependency" >&2
            exit 1
          fi
          out=$(cargo tree --locked --target all -e features,normal -p dstreamy-cli -i dstreamy-media)
          if grep -F 'feature "openh264"' <<<"$out"; then
            echo "dstreamy-media openh264 is enabled through a normal dependency" >&2
            exit 1
          fi
      - name: Default binary links no webview
        shell: bash
        run: |
          set -euo pipefail
          browser_deps='(^|[^[:alnum:]_-])(webkit2gtk|gtk|wry|tao|muda)(-[[:alnum:]_-]+)? v[0-9]'
          tree=$(cargo tree --locked --target all -e normal -p dstreamy-cli)
          if ! grep -Fq 'dstreamy-cli' <<<"$tree"; then
            echo "cargo tree produced no dstreamy-cli dependency tree" >&2
            exit 1
          fi
          matches=$(grep -E "$browser_deps" <<<"$tree" || [ "$?" -eq 1 ])
          if [ -n "$matches" ]; then
            echo "the default dstreamy-cli dependency tree contains browser crates:" >&2
            echo "$matches" >&2
            exit 1
          fi
          test -x target/debug/dstreamy
          linked=$(ldd target/debug/dstreamy)
          missing=$(grep -F 'not found' <<<"$linked" || [ "$?" -eq 1 ])
          if [ -n "$missing" ]; then
            echo "the default dstreamy binary has unresolved libraries:" >&2
            echo "$missing" >&2
            exit 1
          fi
          webview=$(grep -Ei 'webkit|gtk|soup' <<<"$linked" || [ "$?" -eq 1 ])
          if [ -n "$webview" ]; then
            echo "the default dstreamy binary links a webview library:" >&2
            echo "$webview" >&2
            exit 1
          fi
      - name: Cross-user IPC tests
        run: cargo test -p dstreamy-ipc --locked --test cross_user -- --ignored --skip nobody_helper
        timeout-minutes: 5
        env:
          DSTREAMY_CROSS_USER_TESTS: "1"

  rust-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - name: IPC transport (named pipes)
        run: |
          cargo clippy -p dstreamy-ipc --all-targets --locked -- -D warnings
          cargo test -p dstreamy-ipc --locked
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --locked --no-fail-fast

  browser-login-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    env:
      APT_CACHE: apt-browser-login-linux-ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Restore apt archives
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/apt-archives
          key: ${{ env.APT_CACHE }}-${{ github.run_id }}
          restore-keys: ${{ env.APT_CACHE }}-
      - name: Install system dependencies
        timeout-minutes: 30
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" \
            clang libclang-dev libpipewire-0.3-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev xvfb
      - name: Save apt archives
        if: always()
        uses: ./.github/actions/apt-archives-save
        with:
          key-prefix: ${{ env.APT_CACHE }}
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: browser-login
      - run: cargo clippy -p dstreamy-cli --features browser-login --all-targets --locked -- -D warnings
      - name: Browser login tests
        run: >-
          cargo test -p dstreamy-cli --features browser-login --locked
          --lib --test browser_login --test cli
      - name: Browser smoke under a virtual display
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/browser-smoke.log"
          xvfb-run -a -s "-screen 0 1280x720x24" \
            cargo test -p dstreamy-cli --features browser-login --locked \
            --test browser_smoke -- --nocapture 2>&1 | tee "$log"
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored' "$log" \
            || { echo "the browser smoke test did not pass exactly once" >&2; exit 1; }
          grep -Fq 'browser smoke: ran with a display' "$log" \
            || { echo "the browser smoke test did not run with a display" >&2; exit 1; }
      - name: Feature binary links WebKitGTK
        shell: bash
        run: ldd target/debug/dstreamy | grep -F libwebkit2gtk-4.1

  service-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    env:
      APT_CACHE: apt-service-linux-ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Restore apt archives
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/apt-archives
          key: ${{ env.APT_CACHE }}-${{ github.run_id }}
          restore-keys: ${{ env.APT_CACHE }}-
      - name: Install system dependencies
        timeout-minutes: 30
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" \
            clang libclang-dev libpipewire-0.3-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
      - name: Save apt archives
        if: always()
        uses: ./.github/actions/apt-archives-save
        with:
          key-prefix: ${{ env.APT_CACHE }}
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: service
      - name: Build the service tests
        run: cargo test -p dstreamy-cli --locked --test service --no-run
      - name: Start a user manager
        shell: bash
        run: |
          set -euo pipefail
          systemctl --version | head -n1
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 1 60); do
            state=$(systemctl --user is-system-running 2>/dev/null || true)
            echo "user manager: ${state:-unreachable}"
            case "$state" in running|degraded) exit 0 ;; esac
            sleep 1
          done
          exit 1
      - name: Install, kill and restart the real service
        run: cargo test -p dstreamy-cli --locked --test service -- --include-ignored --test-threads 1
        timeout-minutes: 10
        env:
          DSTREAMY_DISPOSABLE_HOST: "1"
      - name: Service log
        if: failure()
        run: journalctl --user -u dstreamy.service --no-pager -n 200 || true

  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        working-directory: rust
        run: rustup toolchain install
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          dir="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$dir.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$dir.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/$dir.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$dir.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components 1 "$dir/cargo-deny"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/bin:$PATH" cargo deny --version
      - name: Advisories, licenses, bans and sources (main workspace)
        working-directory: rust
        run: cargo deny --locked check
      - name: Advisories, licenses, bans and sources (plugin workspace)
        working-directory: rust/crates/dstreamy-obs
        run: cargo deny --locked --config ../../deny.toml check

  release-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Release and installer script tests
        run: |
          python3 --version
          jq --version
          python3 scripts/test_release_semantics.py
