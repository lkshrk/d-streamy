name: Rust CI

on:
  push:
    branches: [main, rust-rewrite]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-macos:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: xcode-27.1
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Cross-user IPC tests
        run: cargo test -p dstreamy-ipc --locked --test cross_user -- --ignored --skip nobody_helper
        timeout-minutes: 5
        env:
          DSTREAMY_CROSS_USER_TESTS: "1"

  rust-linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev \
            libpipewire-0.3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            libopus-dev
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Shipped crates never enable test-only features
        shell: bash
        run: |
          set -euo pipefail
          out=$(cargo tree --locked --target all -e features,normal -i dstreamy-ipc --workspace)
          if grep -F 'feature "test-support"' <<<"$out"; then
            echo "dstreamy-ipc test-support is enabled through a normal dependency" >&2
            exit 1
          fi
          out=$(cargo tree --locked --target all -e features,normal -i discord-stream-rs --workspace)
          if grep -F 'feature "test-rtp-start"' <<<"$out"; then
            echo "discord-stream-rs test-rtp-start is enabled through a normal dependency" >&2
            exit 1
          fi
      - name: Cross-user IPC tests
        run: cargo test -p dstreamy-ipc --locked --test cross_user -- --ignored --skip nobody_helper
        timeout-minutes: 5
        env:
          DSTREAMY_CROSS_USER_TESTS: "1"

  rust-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust/fuzz
    env:
      # Pinned in docs/specs.md (cargo-fuzz row).
      FUZZ_TOOLCHAIN: nightly-2026-07-20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the pinned nightly and cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          cargo +"$FUZZ_TOOLCHAIN" install cargo-fuzz --version 0.13.2 --locked
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust/fuzz
          key: fuzz
      - name: Fuzz control_line
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz run control_line -- -max_total_time=60
      - name: Fuzz producer_frame
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz run producer_frame -- -max_total_time=60
