name: Rust CI

on:
  push:
    branches: [main, rust-rewrite]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-macos:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: xcode-27.1
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Cross-user IPC tests
        run: cargo test -p dstreamy-ipc --locked --test cross_user -- --ignored --skip nobody_helper
        timeout-minutes: 5
        env:
          DSTREAMY_CROSS_USER_TESTS: "1"

  rust-linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install system dependencies
        timeout-minutes: 30
        run: |
          retry() { for i in 1 2 3; do "$@" && return; echo "attempt $i failed: $*"; sleep 15; done; return 1; }
          apt=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120)
          args=(-y --no-install-recommends clang libclang-dev \
            libpipewire-0.3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            libopus-dev)
          retry sudo apt-get "${apt[@]}" update
          # Only fetches are retried: killing an install mid-unpack leaves dpkg broken.
          retry sudo apt-get "${apt[@]}" install --download-only "${args[@]}"
          sudo apt-get "${apt[@]}" install --no-download "${args[@]}"
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Shipped crates never enable test-only features
        shell: bash
        run: |
          set -euo pipefail
          out=$(cargo tree --locked --target all -e features,normal -i dstreamy-ipc --workspace)
          if grep -F 'feature "test-support"' <<<"$out"; then
            echo "dstreamy-ipc test-support is enabled through a normal dependency" >&2
            exit 1
          fi
          out=$(cargo tree --locked --target all -e features,normal -i discord-stream-rs --workspace)
          if grep -F 'feature "test-rtp-start"' <<<"$out"; then
            echo "discord-stream-rs test-rtp-start is enabled through a normal dependency" >&2
            exit 1
          fi
          out=$(cargo tree --locked --target all -e features,normal -i dstreamy-cli --workspace)
          if grep -F 'feature "test-hooks"' <<<"$out"; then
            echo "dstreamy-cli test-hooks is enabled through a normal dependency" >&2
            exit 1
          fi
      - name: Cross-user IPC tests
        run: cargo test -p dstreamy-ipc --locked --test cross_user -- --ignored --skip nobody_helper
        timeout-minutes: 5
        env:
          DSTREAMY_CROSS_USER_TESTS: "1"

  service-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install system dependencies
        timeout-minutes: 30
        run: |
          retry() { for i in 1 2 3; do "$@" && return; echo "attempt $i failed: $*"; sleep 15; done; return 1; }
          apt=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120)
          args=(-y --no-install-recommends clang libclang-dev \
            libpipewire-0.3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libopus-dev)
          retry sudo apt-get "${apt[@]}" update
          # Only fetches are retried: killing an install mid-unpack leaves dpkg broken.
          retry sudo apt-get "${apt[@]}" install --download-only "${args[@]}"
          sudo apt-get "${apt[@]}" install --no-download "${args[@]}"
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: service
      - name: Build the service tests
        run: cargo test -p dstreamy-cli --locked --test service --no-run
      - name: Start a user manager
        shell: bash
        run: |
          set -euo pipefail
          systemctl --version | head -n1
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 1 60); do
            state=$(systemctl --user is-system-running 2>/dev/null || true)
            echo "user manager: ${state:-unreachable}"
            case "$state" in running|degraded) exit 0 ;; esac
            sleep 1
          done
          exit 1
      - name: Install, kill and restart the real service
        run: cargo test -p dstreamy-cli --locked --test service -- --include-ignored --test-threads 1
        timeout-minutes: 10
        env:
          DSTREAMY_DISPOSABLE_HOST: "1"
      - name: Service log
        if: failure()
        run: journalctl --user -u dstreamy.service --no-pager -n 200 || true

  rust-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust/fuzz
    env:
      # Pinned in docs/specs.md (cargo-fuzz row).
      FUZZ_TOOLCHAIN: nightly-2026-07-20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the pinned nightly and cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          cargo +"$FUZZ_TOOLCHAIN" install cargo-fuzz --version 0.13.2 --locked
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust/fuzz
          key: fuzz
      - name: Fuzz control_line
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz run control_line -- -max_total_time=60
      - name: Fuzz producer_frame
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz run producer_frame -- -max_total_time=60
