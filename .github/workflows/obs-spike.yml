name: OBS headless spike

on:
  push:
    branches: [rust-rewrite]
    paths:
      - "obs/**"
      - ".github/workflows/obs-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obs-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  OBS_TAG: "32.2.2"
  OBS_COMMIT: ba2f32bdf791005443988a4955e963663e16b1ed
  OBS_BUILD_REV: "1"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set paths
        run: |
          echo "OBS_PREFIX=$RUNNER_TEMP/obs-prefix" >> "$GITHUB_ENV"
          echo "SPIKE_LOGS=$RUNNER_TEMP/spike-logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/spike-logs"

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl jq \
            libglib2.0-dev extra-cmake-modules libcurl4-openssl-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libjansson-dev libx11-xcb-dev libgles2-mesa-dev \
            libwayland-dev libpipewire-0.3-dev libpulse-dev libx264-dev libmbedtls-dev libgl1-mesa-dev \
            uthash-dev libsimde-dev libx11-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinerama0-dev \
            libxcb-composite0-dev libxinerama-dev libxcb1-dev libxcb-xfixes0-dev libxss-dev libglvnd-dev \
            libxkbcommon-dev libxcomposite-dev libxdamage-dev libasound2-dev libfontconfig-dev \
            libfreetype6-dev libspeexdsp-dev libudev-dev libv4l-dev libva-dev libpci-dev libdrm-dev \
            nlohmann-json3-dev libwebsocketpp-dev libasio-dev libqrcodegencpp-dev \
            qt6-base-dev libqt6svg6-dev qt6-base-private-dev \
            xvfb xauth libegl-mesa0 libgl1-mesa-dri mesa-utils

      - name: Restore OBS build
        id: obs-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/obs-prefix
          key: obs-${{ env.OBS_TAG }}-ubuntu-24.04-r${{ env.OBS_BUILD_REV }}

      - name: Build OBS ${{ env.OBS_TAG }}
        if: steps.obs-cache.outputs.cache-hit != 'true'
        run: |
          start=$(date +%s)
          git clone --depth 1 --branch "$OBS_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/obsproject/obs-studio.git "$RUNNER_TEMP/obs-src"
          cd "$RUNNER_TEMP/obs-src"
          test "$(git rev-parse HEAD)" = "$OBS_COMMIT"
          cmake --preset ubuntu \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$OBS_PREFIX" \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
            -DENABLE_BROWSER=OFF -DENABLE_SCRIPTING=OFF -DENABLE_VLC=OFF \
            -DENABLE_NVENC=OFF -DENABLE_QSV11=OFF -DENABLE_NEW_MPEGTS_OUTPUT=OFF \
            -DENABLE_WEBRTC=OFF -DENABLE_AJA=OFF
          cmake --build build_ubuntu --parallel
          cmake --install build_ubuntu
          echo "OBS build took $(( $(date +%s) - start )) s" | tee "$OBS_PREFIX/build-time.txt"

      - name: Save OBS build
        if: steps.obs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/obs-prefix
          key: obs-${{ env.OBS_TAG }}-ubuntu-24.04-r${{ env.OBS_BUILD_REV }}

      - name: Build spike
        run: |
          cat "$OBS_PREFIX/build-time.txt" || true
          cmake -S obs/spike -B "$RUNNER_TEMP/spike-build" -G Ninja -DCMAKE_PREFIX_PATH="$OBS_PREFIX"
          cmake --build "$RUNNER_TEMP/spike-build"

      - name: Run spike (EGL on Xvfb, Mesa llvmpipe)
        run: |
          set -o pipefail
          libdir=$(dirname "$(find "$OBS_PREFIX" -name 'libobs.so*' | head -n 1)")
          gl=$(find "$libdir" -maxdepth 1 -name 'libobs-opengl.so*' | head -n 1)
          export LD_LIBRARY_PATH="$libdir" LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1280x720x24" sh -c 'eglinfo -B 2>/dev/null | head -n 40 || true; glxinfo -B | head -n 20 || true' \
            | tee "$SPIKE_LOGS/linux-gl-info.log"
          xvfb-run -a -s "-screen 0 1280x720x24" "$RUNNER_TEMP/spike-build/obs-headless-spike" --graphics "$gl" \
            | tee "$SPIKE_LOGS/linux-spike.log"

      - name: Run spike without a display
        continue-on-error: true
        run: |
          set -o pipefail
          libdir=$(dirname "$(find "$OBS_PREFIX" -name 'libobs.so*' | head -n 1)")
          gl=$(find "$libdir" -maxdepth 1 -name 'libobs-opengl.so*' | head -n 1)
          unset DISPLAY
          LD_LIBRARY_PATH="$libdir" timeout 60 "$RUNNER_TEMP/spike-build/obs-headless-spike" --graphics "$gl" \
            | tee "$SPIKE_LOGS/linux-spike-no-display.log"

      - name: Frontend with obs-websocket (stretch)
        continue-on-error: true
        run: |
          set -o pipefail
          libdir=$(dirname "$(find "$OBS_PREFIX" -name 'libobs.so*' | head -n 1)")
          export XDG_CONFIG_HOME="$RUNNER_TEMP/obs-config" LD_LIBRARY_PATH="$libdir" LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1920x1080x24" bash obs/spike/frontend-smoke.sh \
            "$XDG_CONFIG_HOME/obs-studio" "$SPIKE_LOGS/linux-frontend-stdout.log" "$OBS_PREFIX/bin/obs" \
            | tee "$SPIKE_LOGS/linux-frontend.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: obs-spike-linux
          path: ${{ runner.temp }}/spike-logs

  macos:
    runs-on: xcode-27
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: Set paths
        run: |
          echo "OBS_PREFIX=$RUNNER_TEMP/obs-prefix" >> "$GITHUB_ENV"
          echo "SPIKE_LOGS=$RUNNER_TEMP/spike-logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/spike-logs"

      - name: Record runner capabilities (Q13)
        continue-on-error: true
        run: |
          {
            echo "## sw_vers"; sw_vers
            echo "## uname"; uname -a
            echo "## id"; id
            echo "## launchctl managername"; launchctl managername
            echo "## launchctl print gui/$(id -u)"; launchctl print "gui/$(id -u)" 2>&1 | head -n 60
            echo "## exit status $?"
            echo "## GUI processes"; pgrep -lf 'WindowServer|loginwindow|Dock|Finder' || true
            echo "## displays"; system_profiler SPDisplaysDataType 2>&1
            echo "## hardware"; system_profiler SPHardwareDataType 2>&1 | grep -E 'Model|Chip|Cores|Memory'
          } 2>&1 | tee "$SPIKE_LOGS/macos-runner-capabilities.log"

      - name: Restore OBS build
        id: obs-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/obs-prefix
          key: obs-${{ env.OBS_TAG }}-xcode-27.1-arm64-r${{ env.OBS_BUILD_REV }}

      - name: Build OBS ${{ env.OBS_TAG }}
        if: steps.obs-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          start=$(date +%s)
          git clone --depth 1 --branch "$OBS_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/obsproject/obs-studio.git "$RUNNER_TEMP/obs-src"
          cd "$RUNNER_TEMP/obs-src"
          test "$(git rev-parse HEAD)" = "$OBS_COMMIT"
          cmake --preset macos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
            -DENABLE_BROWSER=OFF -DENABLE_SCRIPTING=OFF -DENABLE_VIRTUALCAM=OFF -DENABLE_AJA=OFF \
            -DSPARKLE_APPCAST_URL= -DSPARKLE_PUBLIC_KEY=
          cmake --build build_macos --config RelWithDebInfo --target obs-studio -- -quiet 2>&1 \
            | xcbeautify --quiet --renderer github-actions
          mkdir -p "$OBS_PREFIX"
          cmake --install build_macos --config RelWithDebInfo --prefix "$OBS_PREFIX"
          cmake --install build_macos --config RelWithDebInfo --component Development --prefix "$OBS_PREFIX"
          cp -R .deps/obs-deps-2*-universal "$OBS_PREFIX/obs-deps"
          echo "OBS build took $(( $(date +%s) - start )) s" | tee "$OBS_PREFIX/build-time.txt"

      - name: Save OBS build
        if: steps.obs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/obs-prefix
          key: obs-${{ env.OBS_TAG }}-xcode-27.1-arm64-r${{ env.OBS_BUILD_REV }}

      - name: Build spike
        run: |
          cat "$OBS_PREFIX/build-time.txt" || true
          find "$OBS_PREFIX" -maxdepth 3 | head -n 40
          cmake -S obs/spike -B "$RUNNER_TEMP/spike-build" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$OBS_PREFIX/obs-deps" \
            -DCMAKE_FRAMEWORK_PATH="$OBS_PREFIX/Frameworks;$OBS_PREFIX/OBS.app/Contents/Frameworks"
          cmake --build "$RUNNER_TEMP/spike-build"
          cp "$RUNNER_TEMP/spike-build/obs-headless-spike" "$OBS_PREFIX/OBS.app/Contents/MacOS/"

      - name: Run spike (OpenGL)
        run: |
          set -o pipefail
          app="$OBS_PREFIX/OBS.app/Contents"
          find "$app/Frameworks" -maxdepth 1 | tee "$SPIKE_LOGS/macos-frameworks.log"
          "$app/MacOS/obs-headless-spike" --graphics "$app/Frameworks/libobs-opengl.dylib" \
            | tee "$SPIKE_LOGS/macos-spike-opengl.log"

      - name: Backtrace spike (OpenGL) under lldb
        if: failure()
        continue-on-error: true
        run: |
          app="$OBS_PREFIX/OBS.app/Contents"
          lldb --batch -o run -k "thread backtrace all" -k quit -- \
            "$app/MacOS/obs-headless-spike" --graphics "$app/Frameworks/libobs-opengl.dylib" 2>&1 \
            | tee "$SPIKE_LOGS/macos-spike-opengl-lldb.log" | grep -v '^SPIKE \(video\|audio\) packet bytes'

      - name: Run spike (Metal)
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          app="$OBS_PREFIX/OBS.app/Contents"
          "$app/MacOS/obs-headless-spike" --graphics "$app/Frameworks/libobs-metal.dylib" \
            | tee "$SPIKE_LOGS/macos-spike-metal.log"

      - name: Run spike (VideoToolbox H.264)
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          app="$OBS_PREFIX/OBS.app/Contents"
          grep 'SPIKE encoder-type' "$SPIKE_LOGS/macos-spike-opengl.log" | tee "$SPIKE_LOGS/macos-encoder-types.log"
          rc=1
          grep -o 'encoder-type: [^ ]*videotoolbox[^ ]* codec=h264' "$SPIKE_LOGS/macos-spike-opengl.log" \
            | awk '{print $2}' > "$RUNNER_TEMP/vt-ids.txt"
          while read -r vt; do
            echo "=== VideoToolbox H.264 encoder id: $vt"
            log="$SPIKE_LOGS/macos-spike-vt-$(echo "$vt" | tr ':/' '__').log"
            if "$app/MacOS/obs-headless-spike" --verbose --graphics "$app/Frameworks/libobs-opengl.dylib" \
              --video-encoder "$vt" | tee "$log"; then
              rc=0
            fi
          done < "$RUNNER_TEMP/vt-ids.txt"
          exit "$rc"

      - name: Frontend with obs-websocket (stretch)
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          cfg="$HOME/Library/Application Support/obs-studio"
          bash obs/spike/frontend-smoke.sh "$cfg" "$SPIKE_LOGS/macos-frontend-stdout.log" \
            "$OBS_PREFIX/OBS.app/Contents/MacOS/OBS" | tee "$SPIKE_LOGS/macos-frontend.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: obs-spike-macos
          path: ${{ runner.temp }}/spike-logs

  windows:
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set paths
        run: |
          "OBS_PREFIX=$env:RUNNER_TEMP\obs-prefix" >> $env:GITHUB_ENV
          "SPIKE_LOGS=$env:RUNNER_TEMP\spike-logs" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\spike-logs" | Out-Null

      - name: Record adapters
        continue-on-error: true
        run: |
          Get-CimInstance Win32_VideoController | Format-List Name, AdapterCompatibility, DriverVersion, PNPDeviceID |
            Tee-Object -FilePath "$env:SPIKE_LOGS\windows-adapters.log"
          query session 2>&1 | Tee-Object -Append -FilePath "$env:SPIKE_LOGS\windows-adapters.log"

      - name: Restore OBS build
        id: obs-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}\obs-prefix
          key: obs-${{ env.OBS_TAG }}-windows-2025-x64-r${{ env.OBS_BUILD_REV }}

      - name: Build OBS ${{ env.OBS_TAG }}
        if: steps.obs-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $start = Get-Date
          git clone --depth 1 --branch $env:OBS_TAG --recurse-submodules --shallow-submodules `
            https://github.com/obsproject/obs-studio.git "$env:RUNNER_TEMP\obs-src"
          Set-Location "$env:RUNNER_TEMP\obs-src"
          if ((git rev-parse HEAD) -ne $env:OBS_COMMIT) { throw "unexpected OBS commit" }
          cmake --preset windows-x64 `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF `
            -DENABLE_BROWSER=OFF -DENABLE_SCRIPTING=OFF -DENABLE_VIRTUALCAM=OFF -DENABLE_AJA=OFF
          cmake --build --preset windows-x64 --parallel -- /consoleLoggerParameters:Summary /noLogo /verbosity:minimal
          cmake --install build_x64 --config RelWithDebInfo --prefix $env:OBS_PREFIX
          cmake --install build_x64 --config RelWithDebInfo --component Development --prefix $env:OBS_PREFIX
          $deps = Get-ChildItem .deps -Directory -Filter 'obs-deps-*-x64' | Where-Object { $_.Name -notlike '*qt6*' } | Select-Object -First 1
          Copy-Item -Recurse $deps.FullName "$env:OBS_PREFIX\obs-deps"
          $secs = [int]((Get-Date) - $start).TotalSeconds
          "OBS build took $secs s" | Tee-Object -FilePath "$env:OBS_PREFIX\build-time.txt"

      - name: Save OBS build
        if: steps.obs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}\obs-prefix
          key: obs-${{ env.OBS_TAG }}-windows-2025-x64-r${{ env.OBS_BUILD_REV }}

      - name: Build spike
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Get-Content "$env:OBS_PREFIX\build-time.txt" -ErrorAction SilentlyContinue
          cmake -S obs/spike -B "$env:RUNNER_TEMP\spike-build" -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:OBS_PREFIX;$env:OBS_PREFIX\obs-deps"
          cmake --build "$env:RUNNER_TEMP\spike-build" --config RelWithDebInfo
          Copy-Item "$env:RUNNER_TEMP\spike-build\RelWithDebInfo\obs-headless-spike.exe" "$env:OBS_PREFIX\bin\64bit\"

      - name: Run spike (D3D11)
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location "$env:OBS_PREFIX\bin\64bit"
          .\obs-headless-spike.exe --graphics libobs-d3d11 2>&1 | Tee-Object -FilePath "$env:SPIKE_LOGS\windows-spike-d3d11.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run spike (OpenGL)
        continue-on-error: true
        run: |
          Set-Location "$env:OBS_PREFIX\bin\64bit"
          .\obs-headless-spike.exe --graphics libobs-opengl 2>&1 | Tee-Object -FilePath "$env:SPIKE_LOGS\windows-spike-opengl.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Frontend with obs-websocket (stretch)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ws="$GITHUB_WORKSPACE"
          cfg="$(cygpath -u "$APPDATA")/obs-studio"
          cd "$OBS_PREFIX/bin/64bit"
          bash "$ws/obs/spike/frontend-smoke.sh" "$cfg" "$SPIKE_LOGS/windows-frontend-stdout.log" ./obs64.exe \
            | tee "$SPIKE_LOGS/windows-frontend.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: obs-spike-windows
          path: ${{ runner.temp }}\spike-logs
