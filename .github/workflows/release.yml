name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # CI listens only to branch pushes, so tags on tested tips need their own trigger.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# Serialize runs because annotated tag and commit SHAs cannot share a per-SHA race guard.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  # Cheap ubuntu gate so the macOS release job only starts for a CI-verified, unreleased vX.Y.Z tag.
  gate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Annotated tag pushes set github.sha to the tag object, not its commit.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Verify latest CI passed
        id: civerify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Dereference through any annotated tag to the tested commit.
          TARGET_SHA="$(git rev-parse 'HEAD^{commit}')"

          # A failed rerun must supersede an older success for the same commit.
          latest="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${TARGET_SHA}" \
            -f event=push \
            -f per_page=100 \
            --jq '.workflow_runs | sort_by(.run_number) | last | [.status, (.conclusion // "")] | @tsv' 2>/dev/null || true)"

          if [ -z "${latest}" ]; then
            echo "::error::No CI run found for commit ${TARGET_SHA}."
            exit 1
          fi

          IFS=$'\t' read -r ci_status ci_conclusion <<< "${latest}"
          if [ "${ci_status}" = "completed" ] && [ "${ci_conclusion}" = "success" ]; then
            echo "Latest CI run for ${TARGET_SHA} passed."
            echo "approved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A tag or older workflow_run arriving mid-CI is deferred to the latest successful workflow_run trigger.
          if [ "${ci_status}" != "completed" ] && [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "CI for ${TARGET_SHA} is still running; deferring to the workflow_run trigger."
            exit 0
          fi

          echo "::error::Latest CI run for ${TARGET_SHA} finished with ${ci_conclusion:-unknown}."
          exit 1

      - name: Check for release tag
        id: tag
        if: steps.civerify.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$TAG" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No vX.Y.Z tag points at this commit; skipping release."
            exit 0
          fi
          # Tag-push and workflow_run can both pass the gate for the same tag.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping duplicate publish."
            exit 0
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

  release:
    needs: gate
    if: needs.gate.outputs.tag != ''
    runs-on: macos-26
    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.tag }}
          fetch-depth: 0

      - name: Select latest Xcode 26 (needs SDK >= 15.2 for SCContentFilter.includedWindows)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install daemon dependencies
        run: bun install

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          echo "$CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | tr -d '"')

      - name: Build & sign (Developer ID, hardened, nested)
        env:
          CODESIGN_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          export VERSION="${TAG#v}"
          export BUN_BIN="$(command -v bun)"
          bash scripts/release.sh

      - name: Notarize & staple
        id: pkg
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          APP="bin/D-Streamy.app"
          echo "$NOTARY_KEY_P8" | base64 --decode > $RUNNER_TEMP/notary.p8
          ditto -c -k --sequesterRsrc --keepParent "$APP" D-Streamy.zip
          SUBMIT_JSON=$(xcrun notarytool submit D-Streamy.zip \
            --key $RUNNER_TEMP/notary.p8 \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --output-format json --wait)
          echo "$SUBMIT_JSON"
          SUBMIT_ID=$(echo "$SUBMIT_JSON" | /usr/bin/python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          STATUS=$(echo "$SUBMIT_JSON" | /usr/bin/python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')
          echo "Notarization status: $STATUS (id $SUBMIT_ID)"
          xcrun notarytool log "$SUBMIT_ID" \
            --key $RUNNER_TEMP/notary.p8 \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" || true
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization not accepted (status $STATUS) — see log above."
            exit 1
          fi
          xcrun stapler staple "$APP"
          rm D-Streamy.zip
          ditto -c -k --sequesterRsrc --keepParent "$APP" D-Streamy.zip
          echo "sha256=$(shasum -a 256 D-Streamy.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" D-Streamy.zip \
            --title "$TAG" \
            --generate-notes \
            --notes "sha256: \`${{ steps.pkg.outputs.sha256 }}\`"

      - name: Bump Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          SHA="${{ steps.pkg.outputs.sha256 }}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/lkshrk/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp Casks/d-streamy.rb tap/Casks/d-streamy.rb
          sed -i '' -E "s/version \".*\"/version \"${VERSION}\"/" tap/Casks/d-streamy.rb
          sed -i '' -E "s/sha256 \".*\"/sha256 \"${SHA}\"/" tap/Casks/d-streamy.rb
          cd tap
          git add Casks/d-streamy.rb
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "d-streamy: bump to ${VERSION}"
            git push
          fi
