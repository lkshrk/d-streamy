name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # CI listens only to branch pushes, so tags on tested tips need their own trigger.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# Serialize runs because annotated tag and commit SHAs cannot share a per-SHA race guard.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  # Cheap ubuntu gate so the macOS release job only starts for a CI-verified, unreleased vX.Y.Z tag.
  gate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Annotated tag pushes set github.sha to the tag object, not its commit.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Verify latest CI passed
        id: civerify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Dereference through any annotated tag to the tested commit.
          TARGET_SHA="$(git rev-parse 'HEAD^{commit}')"

          # A failed rerun must supersede an older success for the same commit.
          latest="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${TARGET_SHA}" \
            -f event=push \
            -f per_page=100 \
            --jq '.workflow_runs | sort_by(.run_number) | last | [.status, (.conclusion // "")] | @tsv' 2>/dev/null || true)"

          if [ -z "${latest}" ]; then
            echo "::error::No CI run found for commit ${TARGET_SHA}."
            exit 1
          fi

          IFS=$'\t' read -r ci_status ci_conclusion <<< "${latest}"
          if [ "${ci_status}" = "completed" ] && [ "${ci_conclusion}" = "success" ]; then
            echo "Latest CI run for ${TARGET_SHA} passed."
            echo "approved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A tag or older workflow_run arriving mid-CI is deferred to the latest successful workflow_run trigger.
          if [ "${ci_status}" != "completed" ] && [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "CI for ${TARGET_SHA} is still running; deferring to the workflow_run trigger."
            exit 0
          fi

          echo "::error::Latest CI run for ${TARGET_SHA} finished with ${ci_conclusion:-unknown}."
          exit 1

      - name: Check for release tag
        id: tag
        if: steps.civerify.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$TAG" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No vX.Y.Z tag points at this commit; skipping release."
            exit 0
          fi
          # Tag-push and workflow_run can both pass the gate for the same tag.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping duplicate publish."
            exit 0
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

  release:
    needs: gate
    if: needs.gate.outputs.tag != ''
    runs-on: xcode-27
    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.gate.outputs.tag }}
          fetch-depth: 0

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          swift --version

      - name: Install toolchain from rust-toolchain.toml
        working-directory: rust
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Refuse test-only features in the bundled daemon
        working-directory: rust
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            out=$(for crate in dstreamy-cli dstreamy-discord discord-stream-rs dstreamy-ipc dstreamy-media; do
              cargo tree --locked -p dstreamy-cli -e features,normal --target "$target" -i "$crate"
            done)
            if grep -E 'feature "(test-hooks|test-rtp-start|test-support|test-pattern|openh264)"' <<<"$out"; then
              echo "a test-only feature reaches the bundled daemon" >&2
              exit 1
            fi
          done

      - name: Build universal dstreamy
        working-directory: rust
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          cargo build --release --locked -p dstreamy-cli --target aarch64-apple-darwin
          cargo build --release --locked -p dstreamy-cli --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/dstreamy \
            target/aarch64-apple-darwin/release/dstreamy \
            target/x86_64-apple-darwin/release/dstreamy
          lipo target/universal/dstreamy -verify_arch arm64 x86_64

      - name: Install Rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Run both slices of the universal dstreamy
        working-directory: rust
        run: |
          set -euo pipefail
          expected=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dstreamy-cli") | .version')
          for slice in arm64 x86_64; do
            out=$(arch "-$slice" target/universal/dstreamy --version)
            echo "$slice: $out"
            test "$out" = "dstreamy $expected" || { echo "::error::$slice slice reports '$out', expected dstreamy $expected"; exit 1; }
          done

      - name: Import signing certificate
        uses: ./.github/actions/macos-signing-keychain
        with:
          cert-p12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          cert-password: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Build & sign (Developer ID, hardened, nested)
        env:
          CODESIGN_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          export VERSION="${TAG#v}"
          export DSTREAMY_DAEMON="$PWD/rust/target/universal/dstreamy"
          bash scripts/release.sh
          lipo bin/D-Streamy.app/Contents/MacOS/D-Streamy -verify_arch arm64 x86_64

      - name: Zip the app for notarization
        run: ditto -c -k --sequesterRsrc --keepParent bin/D-Streamy.app D-Streamy.zip

      - name: Notarize
        uses: ./.github/actions/macos-notarize
        with:
          path: D-Streamy.zip
          key-p8: ${{ secrets.NOTARY_KEY_P8 }}
          key-id: ${{ secrets.NOTARY_KEY_ID }}
          issuer-id: ${{ secrets.NOTARY_ISSUER_ID }}

      - name: Staple and zip
        id: pkg
        run: |
          set -euo pipefail
          APP="bin/D-Streamy.app"
          xcrun stapler staple "$APP"
          rm D-Streamy.zip
          ditto -c -k --sequesterRsrc --keepParent "$APP" D-Streamy.zip
          echo "sha256=$(shasum -a 256 D-Streamy.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" D-Streamy.zip \
            --title "$TAG" \
            --generate-notes \
            --notes "sha256: \`${{ steps.pkg.outputs.sha256 }}\`"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: lkshrk/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
          persist-credentials: false

      - name: Bump Homebrew tap
        env:
          # gh's credential helper hands this to git for the push only; nothing lands in .git/config.
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          SHA: ${{ steps.pkg.outputs.sha256 }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          gh auth setup-git
          mkdir -p tap/Casks
          cp Casks/d-streamy.rb tap/Casks/d-streamy.rb
          sed -i '' -E "s/version \".*\"/version \"${VERSION}\"/" tap/Casks/d-streamy.rb
          sed -i '' -E "s/sha256 \".*\"/sha256 \"${SHA}\"/" tap/Casks/d-streamy.rb
          cd tap
          git add Casks/d-streamy.rb
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "d-streamy: bump to ${VERSION}"
            git push
          fi
