name: Fetch the OBS prefix
description: >-
  Restore a pinned OBS install prefix from a recent successful rust-rewrite push or dispatch run of obs-ci,
  else from the Actions cache.
inputs:
  key:
    description: Cache key of the prefix; the artifact is <key>.tar.gz.
    required: true
  path:
    description: Directory to restore the prefix into.
    required: true
outputs:
  hit:
    description: '"true" when the prefix was restored from either source.'
    value: ${{ steps.unpack.outputs.hit == 'true' || steps.cache.outputs.cache-hit == 'true' }}
runs:
  using: composite
  steps:
    - name: Find the prefix in a rust-rewrite run
      id: find
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        ARTIFACT: ${{ inputs.key }}.tar.gz
      run: |
        set -euo pipefail
        branch=$(gh api "repos/$REPO/branches/rust-rewrite" --jq .commit.sha) || branch=
        candidates=
        if [ -n "$branch" ]; then
          candidates=$(gh api "repos/$REPO/actions/artifacts?name=$ARTIFACT&per_page=100" --jq '
            [.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "rust-rewrite"
              and .workflow_run.head_repository_id == .workflow_run.repository_id)]
            | sort_by(.created_at) | reverse | .[:5][] | "\(.workflow_run.id) \(.workflow_run.head_sha)"') || candidates=
        fi
        while read -r id sha; do
          [ -n "$id" ] || continue
          # pull_request runs carry a fork-chosen head branch name, so only push and dispatch runs count.
          run=$(gh api "repos/$REPO/actions/runs/$id" --jq 'select((.event == "push" or .event == "workflow_dispatch")
            and .conclusion == "success" and (.path | startswith(".github/workflows/obs-ci.yml"))) | .id') || run=
          [ -n "$run" ] || continue
          # head_branch is only a name, not a ref; the run's commit must also be on the branch.
          status=$(gh api "repos/$REPO/compare/$sha...$branch" --jq .status) || status=
          case "$status" in identical | ahead) ;; *) continue ;; esac
          echo "$ARTIFACT from run $id"
          echo "run-id=$id" >> "$GITHUB_OUTPUT"
          exit 0
        done <<<"$candidates"
        echo "No usable $ARTIFACT from a successful rust-rewrite run; trying the cache"

    - name: Download the prefix
      id: download
      if: steps.find.outputs.run-id != ''
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.key }}.tar.gz
        path: ${{ runner.temp }}/obs-prefix-download
        run-id: ${{ steps.find.outputs.run-id }}
        github-token: ${{ github.token }}

    - name: Unpack the prefix
      id: unpack
      if: steps.download.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        ARTIFACT: ${{ inputs.key }}.tar.gz
        DOWNLOAD: ${{ runner.temp }}/obs-prefix-download
        PREFIX: ${{ inputs.path }}
      run: |
        set -uo pipefail
        unix() { if command -v cygpath >/dev/null; then cygpath -u "$1"; else printf '%s\n' "$1"; fi; }
        download=$(unix "$DOWNLOAD")
        prefix=$(unix "$PREFIX")
        archive=$(find "$download" -type f -name "$ARTIFACT" | head -n 1)
        rm -rf "$prefix" "$prefix.unpack"
        if [ -n "$archive" ] && mkdir -p "$prefix.unpack" && tar -xzf "$archive" -C "$prefix.unpack" &&
          mv "$prefix.unpack" "$prefix"; then
          echo hit=true >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Could not unpack $ARTIFACT; trying the cache"
          rm -rf "$prefix" "$prefix.unpack"
        fi
        rm -rf "$download"

    - name: Restore the prefix from the cache
      id: cache
      if: steps.unpack.outputs.hit != 'true'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
