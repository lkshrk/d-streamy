name: Publish the OBS prefix
description: Upload a pinned OBS install prefix as the <key>.tar.gz artifact that obs-prefix-fetch looks for.
inputs:
  key:
    description: Cache key of the prefix.
    required: true
  path:
    description: Directory that holds the prefix.
    required: true
runs:
  using: composite
  steps:
    - name: Pack the prefix
      shell: bash
      env:
        ARCHIVE: ${{ runner.temp }}/${{ inputs.key }}.tar.gz
        PREFIX: ${{ inputs.path }}
      run: |
        set -euo pipefail
        unix() { if command -v cygpath >/dev/null; then cygpath -u "$1"; else printf '%s\n' "$1"; fi; }
        tar -czf "$(unix "$ARCHIVE")" -C "$(unix "$PREFIX")" .

    # A tarball, not the upload's zip, keeps symlinks and executable bits.
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ${{ runner.temp }}/${{ inputs.key }}.tar.gz
        archive: false
        overwrite: true
        if-no-files-found: error
